<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interconnection map</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --fg: #1a1a19; --muted: #6b6b66; --line: #d9d9d4;
    --org: #3b6ea5; --investor: #7a5ea8; --unverified: #b0803a; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161715; --fg:#eceae4; --muted:#9a9a92; --line:#33352f;
            --org:#7aa9d8; --investor:#b39ddb; --unverified:#d9a55a; --card:#1e201d; }
  }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .stats { display:flex; gap:28px; flex-wrap:wrap; margin: 0 0 24px;
           padding:14px 18px; background:var(--card); border:1px solid var(--line);
           border-radius:10px; }
  .stat b { display:block; font-size:20px; font-variant-numeric: tabular-nums; }
  .stat span { color:var(--muted); font-size:12px; }
  figure { margin:0 0 24px; background:var(--card); border:1px solid var(--line);
           border-radius:10px; overflow-x:auto; }
  svg { display:block; min-width:640px; }
  .legend { display:flex; gap:20px; flex-wrap:wrap; color:var(--muted); font-size:13px;
            margin-bottom:24px; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px;
              margin-right:6px; vertical-align:-1px; }
  table { border-collapse: collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);
           vertical-align: top; }
  th { color:var(--muted); font-weight:600; }
  .note { color:var(--muted); font-size:13px; border-left:3px solid var(--line);
          padding-left:14px; margin: 28px 0 0; }
  .err { color:#c0392b; }
</style>
</head>
<body>
<main>
  <h1>Interconnection map</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="stats" id="stats"></div>
  <figure><svg id="graph" viewBox="0 0 900 420" role="img"
    aria-label="Entity interconnection graph"></svg></figure>
  <div class="legend">
    <span><i style="background:var(--org)"></i>organisation</span>
    <span><i style="background:var(--investor)"></i>investor</span>
    <span><i style="background:var(--unverified)"></i>unverified match, below the floor</span>
  </div>
  <table><thead><tr>
    <th>Entity</th><th>Records merged</th><th>Sources</th>
  </tr></thead><tbody id="rows"></tbody></table>
  <p class="note" id="note"></p>
</main>
<script>
const SVGNS = "http://www.w3.org/2000/svg";
const el = (t, attrs) => {
  const n = document.createElementNS(SVGNS, t);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};
// Content is rendered as text nodes only. Records originate from scraped public sources,
// which is untrusted input, so nothing here is assembled into markup.
const text = (parent, value) => parent.appendChild(document.createTextNode(String(value)));

function stat(container, value, label) {
  const d = document.createElement("div");
  d.className = "stat";
  const b = document.createElement("b");
  text(b, value);
  const s = document.createElement("span");
  text(s, label);
  d.append(b, s);
  container.appendChild(d);
}

function render(graph) {
  document.querySelector("#sub").textContent =
    "Entities resolved from public records, with linkage confidence carried into the output.";

  const stats = document.querySelector("#stats");
  stat(stats, graph.record_count, "records ingested");
  stat(stats, graph.cluster_count, "entities after verified merge");
  stat(stats, graph.confidence_floor, "confidence floor");
  stat(stats, graph.edges.filter(e => !e.verified).length, "links declined");

  const svg = document.querySelector("#graph");
  const nodes = graph.clusters;
  const cx = 450, cy = 205, r = 150;
  const pos = {};
  nodes.forEach((n, i) => {
    const a = (i / nodes.length) * Math.PI * 2 - Math.PI / 2;
    pos[n.id] = { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  });

  for (const e of graph.edges) {
    const a = pos[e.source], b = pos[e.target];
    if (!a || !b) continue;
    const line = el("line", {
      x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      stroke: e.verified ? "var(--line)" : "var(--unverified)",
      "stroke-width": e.verified ? 2 : 1.5,
      "stroke-dasharray": e.verified ? "" : "5 4",
    });
    const title = el("title", {});
    text(title, e.verified
      ? `${e.kind} (${e.provenance})`
      : `declined at ${e.confidence}: ${e.provenance}`);
    line.appendChild(title);
    svg.appendChild(line);
  }

  for (const n of nodes) {
    const p = pos[n.id];
    const g = el("g", {});
    const circle = el("circle", {
      cx: p.x, cy: p.y, r: 10 + Math.min(n.evidence, 4) * 3,
      fill: n.kind === "investor" ? "var(--investor)" : "var(--org)",
    });
    const title = el("title", {});
    text(title, `${n.label} — ${n.evidence} record(s): ${n.members.join(", ")}`);
    circle.appendChild(title);
    const label = el("text", {
      x: p.x, y: p.y - 20, "text-anchor": "middle",
      fill: "var(--fg)", "font-size": "12",
    });
    text(label, n.label);
    g.append(circle, label);
    svg.appendChild(g);
  }

  const rows = document.querySelector("#rows");
  for (const n of nodes) {
    const tr = document.createElement("tr");
    for (const v of [n.label, n.members.join(", "), n.sources.join(", ")]) {
      const td = document.createElement("td");
      text(td, v);
      tr.appendChild(td);
    }
    rows.appendChild(tr);
  }
  document.querySelector("#note").textContent = graph.note || "";
}

fetch("../data/graph.json")
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(render)
  .catch(err => {
    const sub = document.querySelector("#sub");
    sub.className = "sub err";
    sub.textContent = "Could not load ../data/graph.json (" + err.message +
      "). Run: make map";
  });
</script>
</body>
</html>
